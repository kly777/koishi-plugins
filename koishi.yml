plugins:
  # ===== 本地开发用 =====
  ai-provider:
    provider: deepseek
    apiKey: ''
    apiBaseUrl: https://api.deepseek.com/v1
    model: deepseek-v4-flash

  guard:
    injectionLevel: 1
    enableRouting: true

  group:basic:
    help: {}
    http: {}
    logger: {}

  group:console:
    console:
      open: true
    insight: {}
    sandbox: {}
    mcserver: {}
    market:
      registry:
        endpoint: https://registry.npmmirror.com
        timeout: 30000
      search:
        endpoint: https://registry.koishi.chat/index.json
        timeout: 30000

  group:server:
    server:
      port: 5140
      maxPort: 5149

  group:storage:
    database-sqlite:
      path: data/koishi.db

  group:apps:
    mcqa: {}
    ai-auto-reply:
      checkInterval: 60
